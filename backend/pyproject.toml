[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "localtrace-backend"
version = "0.3.0"
description = "Local-first macOS storage observability API for LocalTrace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "psutil>=6,<8",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
  "watchdog>=6,<7",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
localtrace-api = "localtrace_backend.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["localtrace_backend"]

[tool.coverage.report]
show_missing = true
skip_covered = true
